    - title: 'Stale plugable-express dep: version bug fix'
      id: l9ql
      date: "2026-08-14"
      tags:
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: '`sdlc server version`''s CLI-formatted output shows `plugable-express: undefined` in production because bun.lock pins the transitive dependency @liquid-labs/plugable-express@1.0.0-alpha.55 (pulled via @liquid-labs/plugable-express-cli). That version has the versionInfo.server-vs-versionInfo[''plugable-express''] key bug in src/handlers/server/version.js. The bug is already fixed upstream at pluggable-express commit 1367c9f, published as 1.0.0-alpha.57. sdlcpilot-cli itself has no formatter code for this — it''s a pure passthrough to plugable-express-cli''s startCLI(). Fix: once a plugable-express-cli release built against plugable-express>=1.0.0-alpha.57 is available (or the local yalc chain is updated), bump the dependency here and regenerate bun.lock. No sdlcpilot-cli source change needed.'
    - title: bun install alone (even with --force) did not
      id: UGij
      date: "2026-08-15"
      tags:
        - type:ambiguity
        - plan/phase:rename-relocation
        - plan/slug:sdlcpilot-cli-rename
        - priority:unspecified
        - effort:unspecified
      text: bun install alone (even with --force) did not update bun.lock's root-package name field while node_modules was already populated in the worktree — only removing bun.lock and reinstalling from scratch worked. Worth noting in case this is a broader bun behavior.
    - title: Lockfile regeneration re-resolved several @li
      id: NbtV
      date: "2026-08-15"
      tags:
        - type:ambiguity
        - plan/phase:rename-relocation
        - plan/slug:sdlcpilot-cli-rename
        - priority:unspecified
        - effort:unspecified
      text: Lockfile regeneration re-resolved several @liquid-labs/* and transitive dev dependencies to newer semver-compatible versions (e.g. comply-defaults alpha.8->alpha.9, plugable-defaults alpha.4->alpha.7) as a side effect of full reinstall rather than a prior-lockfile baseline. Within task's bun.lock scope but flagging as a side effect beyond the literal name-field change.
    - title: 'make test broken: bun.lock-pinned @liquid-lab'
      id: 2J1p
      date: "2026-08-15"
      tags:
        - type:ambiguity
        - plan/phase:rename-relocation
        - plan/slug:sdlcpilot-cli-rename
        - priority:unspecified
        - effort:unspecified
      text: 'make test broken: bun.lock-pinned @liquid-labs/plugable-defaults@1.0.0-alpha.7 no longer exports PLUGABLE_REGISTRY, which src/core-cli.mjs imports and calls. Manager investigation (post-report) confirmed this is not a stale-lockfile artifact: plugable-defaults''s own current source tree (post pluggable-defaults-rename plan, alpha.7) contains no PLUGABLE_REGISTRY function anywhere - it was dropped entirely. The main sdlcpilot-cli checkout''s node_modules had a stale historical build that happened to still have it, masking the break until task 002''s fresh bun.lock regeneration installed the real, current alpha.7. This is a genuine cross-project API removal/incompatibility, unrelated to the rename itself, requiring a product decision (restore an equivalent in plugable-defaults, or update core-cli to a different config mechanism, or remove the registry-default feature) - out of scope for this rename plan-group to guess at.'
