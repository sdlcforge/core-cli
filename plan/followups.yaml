    - title: Document harness-external-bin gitignore entry
      id: jnPm
      date: "2026-08-08"
      tags:
        - plan/phase:cli-foundation
        - plan/slug:modernization-foundation
        - type:documentation
        - priority:unspecified
        - effort:unspecified
      text: .gitignore adds a `harness-external-bin` entry (spike/bun-compat/) with no corresponding documentation of which build command produces it (unlike the two sibling entries, which map clearly to harness.mjs and harness-raw-childprocess.mjs). Likely the `--external shelljs` compile experiment mentioned in plan/resources/bun-compatibility-spike-findings.md's Finding 1, but that experiment's output filename is never stated. Either document the exact build command in the findings doc, or drop the orphaned gitignore entry.
    - title: 'Bun spike: fix misleading node shebang'
      id: WYlk
      date: "2026-08-08"
      tags:
        - plan/phase:cli-foundation
        - plan/slug:modernization-foundation
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: spike/bun-compat/harness.mjs and harness-raw-childprocess.mjs both carry `#!/usr/bin/env node` shebangs despite existing specifically to validate Bun-specific compiled-binary behavior. If either were ever chmod +x'd and run directly, it would silently run under Node instead of Bun, invalidating the differential result with no error. Low real-world risk today (files are mode 100644, non-executable, and the README correctly instructs `bun run`/`bun build --compile`), but worth changing to `#!/usr/bin/env bun` (or dropping the shebang) to remove the latent footgun for future re-validation.
    - title: 'Bun spike: add SIGINT cleanup for scratch dir'
      id: u0Fw
      date: "2026-08-08"
      tags:
        - plan/phase:cli-foundation
        - plan/slug:modernization-foundation
        - type:bug
        - priority:unspecified
        - effort:unspecified
      text: spike/bun-compat/harness.mjs and harness-raw-childprocess.mjs clean up their mkdtempSync scratch directory in a try/finally block, which covers normal completion and thrown exceptions, but neither registers a SIGINT/SIGTERM handler — a manual Ctrl+C mid-run (plausible, since one check does a real network fetch and another retries git push up to 5 times) bypasses the finally block and leaves the scratch directory on disk. Worth adding a process signal handler that runs the same rmSync cleanup, if this harness is run interactively again for future re-validation.
